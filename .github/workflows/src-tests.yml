name: PomeloDB Source Tests

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "README*", "docs/**", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg"]
  pull_request:
    paths-ignore: ["**/*.md", "README*", "docs/**", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  POMELODB_INSTALL_PREFIX: ${{ runner.temp }}/pomelodb

jobs:
  src-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: src-tests-ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            src-tests-ccache-${{ runner.os }}-

      - name: Install build dependencies
        run: bash .github/scripts/source-test-dependencies.sh build

      - name: Configure native Debug build
        run: |
          set -euo pipefail
          cmake -S . -B build-src-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$POMELODB_INSTALL_PREFIX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGPDB_ENABLE_DEBUG_EXTENSIONS=ON \
            -DGPDB_ENABLE_ORCA=ON \
            -DGPDB_WITH_PERL=ON \
            -DGPDB_WITH_PYTHON=ON \
            -DGPDB_WITH_OPENSSL=ON \
            -DGPDB_WITH_GSSAPI=ON \
            -DGPDB_WITH_LIBXML=ON \
            -DGPDB_WITH_ZLIB=ON \
            -DGPDB_WITH_LIBBZ2=ON \
            -DGPDB_WITH_ZSTD=ON \
            -DGPDB_APR_CONFIG=/usr/bin/apr-1-config

      - name: Build and install native test targets
        run: |
          cmake --build build-src-tests --target gpdb gpdb-regression-tools --parallel 2
          cmake --install build-src-tests --prefix "$POMELODB_INSTALL_PREFIX"

      - name: Package native install
        run: |
          mkdir -p "$RUNNER_TEMP/pomelodb-source-build"
          tar -C "$RUNNER_TEMP" -czf \
            "$RUNNER_TEMP/pomelodb-source-build/pomelodb-native.tar.gz" \
            pomelodb

      - name: Upload native build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomelodb-native-source-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/pomelodb-source-build/pomelodb-native.tar.gz

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  src-regression:
    needs: src-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install runtime dependencies
        run: bash .github/scripts/source-test-dependencies.sh runtime

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: pomelodb-native-source-build-${{ github.sha }}
          path: ${{ runner.temp }}/pomelodb-source-build

      - name: Extract native install
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/pomelodb-source-build/pomelodb-native.tar.gz"

      - name: Initialize and start isolated MPP cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$POMELODB_INSTALL_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$POMELODB_INSTALL_PREFIX/lib:$POMELODB_INSTALL_PREFIX/lib/postgresql:${LD_LIBRARY_PATH:-}"
          cluster_root="$RUNNER_TEMP/pomelodb-native-mpp"
          coordinator="$cluster_root/coordinator"
          segment0="$cluster_root/segment0"
          segment1="$cluster_root/segment1"
          segment2="$cluster_root/segment2"
          mkdir -p "$cluster_root/log"
          for data_dir in "$coordinator" "$segment0" "$segment1" "$segment2"; do
            initdb -D "$data_dir" --no-locale --encoding=UTF8
          done
          cat > "$POMELODB_INSTALL_PREFIX/pomelodb.conf" <<EOF
          cluster_mode=mpp
          coordinator_data_directory=$coordinator
          segment_data_directories=$segment0,$segment1,$segment2
          log_directory=$cluster_root/log
          coordinator_port=15432
          segment_ports=16000,16001,16002
          stop_mode=fast
          wait=true
          EOF
          pomelodb init
          pomelodb start
          {
            echo "POMELODB_CLUSTER_ROOT=$cluster_root"
            echo "PGHOST=127.0.0.1"
            echo "PGPORT=15432"
            echo "PGDATABASE=postgres"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"
          psql -X -v ON_ERROR_STOP=1 -Atqc \
            "select current_setting('gp_role'), count(*) from gp_segment_configuration where status='u'"

      - name: Run src/test/regress schedule
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/pomelodb-regress-results"
          export PGOPTIONS='-c optimizer=off'
          "$POMELODB_INSTALL_PREFIX/bin/pg_regress" \
            --inputdir="$GITHUB_WORKSPACE/src/test/regress" \
            --outputdir="$RUNNER_TEMP/pomelodb-regress-results" \
            --bindir="$POMELODB_INSTALL_PREFIX/bin" \
            --dlpath="$POMELODB_INSTALL_PREFIX/share/postgresql/regress" \
            --tablespace-dir="$RUNNER_TEMP/pomelodb-regress-results/tablespace" \
            --max-concurrent-tests=20 \
            --init-file="$GITHUB_WORKSPACE/src/test/regress/init_file" \
            --load-extension=gp_inject_fault \
            --schedule="$GITHUB_WORKSPACE/src/test/regress/parallel_schedule" \
            --schedule="$GITHUB_WORKSPACE/src/test/regress/greenplum_schedule" \
            2>&1 | tee "$RUNNER_TEMP/pomelodb-regression.log"
          printf '%s\n' "${PIPESTATUS[0]}" > "$RUNNER_TEMP/pomelodb-regression.status"

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pomelodb-src-regression-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/pomelodb-regression.log
            ${{ runner.temp }}/pomelodb-regression.status
            ${{ runner.temp }}/pomelodb-regress-results
            ${{ runner.temp }}/pomelodb-native-mpp/log

      - name: Summarize regression failures
        if: always()
        shell: bash
        run: |
          status=0
          if [[ -f "$RUNNER_TEMP/pomelodb-regression.status" ]]; then
            status="$(cat "$RUNNER_TEMP/pomelodb-regression.status")"
          fi
          echo '### src/test/regress summary' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/pomelodb-regression.log" ]]; then
            grep -E '^[[:space:]]+[[:alnum:]_./-]+[[:space:]]+\.\.\.[[:space:]]+FAILED' \
              "$RUNNER_TEMP/pomelodb-regression.log" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit "$status"

      - name: Stop isolated MPP cluster
        if: always()
        shell: bash
        run: |
          if [[ -x "$POMELODB_INSTALL_PREFIX/bin/pomelodb" ]]; then
            "$POMELODB_INSTALL_PREFIX/bin/pomelodb" stop || true
          fi
