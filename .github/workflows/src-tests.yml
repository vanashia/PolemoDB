name: PomeloDB Source Tests

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "README*", "docs/**", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg"]
  pull_request:
    paths-ignore: ["**/*.md", "README*", "docs/**", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  src-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: src-tests-ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            src-tests-ccache-${{ runner.os }}-

      - name: Install build dependencies
        run: bash .github/scripts/source-test-dependencies.sh build

      - name: Configure native Debug build
        run: |
          set -euo pipefail
          cmake -S . -B build-src-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pomelodb" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGPDB_ENABLE_DEBUG_EXTENSIONS=ON \
            -DGPDB_ENABLE_ORCA=ON \
            -DGPDB_WITH_PERL=ON \
            -DGPDB_WITH_PYTHON=ON \
            -DGPDB_WITH_OPENSSL=ON \
            -DGPDB_WITH_GSSAPI=ON \
            -DGPDB_WITH_LDAP=ON \
            -DGPDB_WITH_LIBXML=ON \
            -DGPDB_WITH_ZLIB=ON \
            -DGPDB_WITH_LIBBZ2=ON \
            -DGPDB_WITH_LIBCURL=ON \
            -DGPDB_WITH_ZSTD=ON \
            -DGPDB_APR_CONFIG=/usr/bin/apr-1-config

      - name: Build and install native database and source-test tools
        run: |
          set -euo pipefail
          cmake --build build-src-tests --target gpdb --parallel 2
          cmake --build build-src-tests --target gpdb-source-test-tools --parallel 2
          cmake --install build-src-tests --prefix "$RUNNER_TEMP/pomelodb"

      - name: Verify native source-test install
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/pomelodb"
          source_root="$install_root/share/postgresql/source-tests"
          for program in pg_regress pg_isolation_regress pg_isolation2_regress isolationtester; do
            test -x "$install_root/bin/$program"
          done
          for module in regress.so fsync_helper.so gplibpq.so heap_checksum_helper.so; do
            test -r "$install_root/lib/postgresql/$module" || \
              test -r "$install_root/share/postgresql/regress/$module"
          done
          for module in citext.so gpextprotocol.so; do
            test -r "$install_root/lib/postgresql/$module"
          done
          test "$(rg -c '^#define USE_CURL 1' build-src-tests/generated/src/include/pg_config.h)" -eq 1
          for suite in regress isolation isolation2 fsync walrep heap_checksum fdw locale authentication recovery kerberos ldap ssl modules perl; do
            test -d "$source_root/$suite"
          done

      - name: Package native install
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pomelodb-source-build"
          tar -C "$RUNNER_TEMP" -czf \
            "$RUNNER_TEMP/pomelodb-source-build/pomelodb-native.tar.gz" \
            pomelodb

      - name: Upload native build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomelodb-native-source-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/pomelodb-source-build/pomelodb-native.tar.gz

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  src-suite:
    needs: src-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite:
          - regress
          - isolation
          - isolation2
          - fsync
          - walrep
          - heap_checksum
          - fdw
          - locale
          - authentication
          - recovery
          - kerberos
          - ldap
          - ssl
          - modules
          - vacuum_progress_row
          - vacuum_progress_column

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install runtime dependencies
        run: bash .github/scripts/source-test-dependencies.sh runtime

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: pomelodb-native-source-build-${{ github.sha }}
          path: ${{ runner.temp }}/pomelodb-source-build

      - name: Extract native install
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/pomelodb-source-build/pomelodb-native.tar.gz"

      - name: Export native test environment
        run: |
          {
            echo "POMELODB_INSTALL_PREFIX=$RUNNER_TEMP/pomelodb"
            echo "SOURCE_TEST_ROOT=$RUNNER_TEMP/pomelodb/share/postgresql/source-tests"
          } >> "$GITHUB_ENV"

      - name: Initialize production MPP test cluster with mirrors
        if: always()
        shell: bash
        run: bash .github/scripts/init-native-source-test-cluster.sh

      - name: Run ${{ matrix.suite }} source-test suite
        id: suite
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: bash .github/scripts/run-native-source-suite.sh

      - name: Upload ${{ matrix.suite }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pomelodb-src-${{ matrix.suite }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/pomelodb-${{ matrix.suite }}.log
            ${{ runner.temp }}/pomelodb-${{ matrix.suite }}.status
            ${{ runner.temp }}/pomelodb-${{ matrix.suite }}-results/**/regression.diffs
            ${{ runner.temp }}/pomelodb-${{ matrix.suite }}-results/**/regression.out
            ${{ runner.temp }}/pomelodb-${{ matrix.suite }}-results/**/*.log
            ${{ runner.temp }}/pomelodb-${{ matrix.suite }}-tap/log/**
            ${{ runner.temp }}/pomelodb-native-mpp/gpinitsystem.log

      - name: Summarize ${{ matrix.suite }} failures
        if: always()
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -u
          status_file="$RUNNER_TEMP/pomelodb-${SUITE}.status"
          log_file="$RUNNER_TEMP/pomelodb-${SUITE}.log"
          cluster_log="$RUNNER_TEMP/pomelodb-native-mpp/gpinitsystem.log"
          final_status=1
          suite_step_outcome="${{ steps.suite.outcome }}"
          {
            echo "## $SUITE source-test summary"
            echo "- Suite step outcome: \`$suite_step_outcome\`"
            if [[ ! -s "$status_file" ]]; then
              echo "The suite produced no status file; initialization or execution failed early."
            else
              while IFS='=' read -r name value; do
                [[ -n "$name" ]] || continue
                echo "- \`$name\`: \`$value\`"
                if [[ "$name" == suite_status ]]; then
                  final_status="$value"
                fi
              done < "$status_file"
            fi
            if [[ -f "$log_file" ]]; then
              echo
              echo '### Failure/error lines'
              grep -E 'FAILED|ERROR|timed out|No such file|not found|BAIL_OUT|Terminated' "$log_file" \
                | tail -n 120 || echo 'No failure marker was observed; inspect the complete artifact.'
              echo
              echo '### Last output'
              tail -80 "$log_file"
            fi
            if [[ -f "$cluster_log" ]]; then
              echo
              echo '### MPP initialization output'
              tail -120 "$cluster_log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$suite_step_outcome" != success || "$final_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Stop production MPP test cluster
        if: always()
        run: |
          if [[ -n "${COORDINATOR_DATA_DIRECTORY:-}" && -x "${POMELODB_INSTALL_PREFIX:-}/bin/gpstop" ]]; then
            COORDINATOR_DATA_DIRECTORY="$COORDINATOR_DATA_DIRECTORY" \
              "$POMELODB_INSTALL_PREFIX/bin/gpstop" -a -d "$COORDINATOR_DATA_DIRECTORY" || true
          fi

  src-summary:
    if: always()
    needs: [src-build, src-suite]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Summarize source-test matrix
        uses: actions/github-script@v7
        with:
          script: |
            const expected = [
              'regress', 'isolation', 'isolation2', 'fsync', 'walrep',
              'heap_checksum', 'fdw', 'locale', 'authentication', 'recovery',
              'kerberos', 'ldap', 'ssl', 'modules', 'vacuum_progress_row',
              'vacuum_progress_column'
            ];
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              }
            );
            const suiteJobs = new Map();
            for (const job of jobs) {
              const match = /^src-suite \((.+)\)$/.exec(job.name);
              if (match) suiteJobs.set(match[1], job);
            }
            const rows = expected.map((suite) => {
              const job = suiteJobs.get(suite);
              return [
                suite,
                job ? job.status : 'missing',
                job?.conclusion || 'missing',
                job?.html_url || ''
              ];
            });
            const failures = rows.filter((row) => row[2] !== 'success');
            await core.summary
              .addHeading('PomeloDB source-test matrix')
              .addTable([
                [
                  {data: 'Suite', header: true},
                  {data: 'Status', header: true},
                  {data: 'Conclusion', header: true},
                  {data: 'Job', header: true}
                ],
                ...rows.map((row) => [
                  row[0], row[1], row[2], row[3] ? `[open](${row[3]})` : ''
                ])
              ])
              .addRaw(`\nFailed or missing suites: ${failures.length}\n`)
              .write();
            if (failures.length > 0) {
              core.setFailed(failures.map((row) => `${row[0]}=${row[2]}`).join(', '));
            }
