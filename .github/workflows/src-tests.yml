name: PomeloDB Source Tests

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "README*", "docs/**", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg"]
  pull_request:
    paths-ignore: ["**/*.md", "README*", "docs/**", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  src-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: src-tests-ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            src-tests-ccache-${{ runner.os }}-

      - name: Install build dependencies
        run: bash .github/scripts/source-test-dependencies.sh build

      - name: Configure native Debug build
        run: |
          set -euo pipefail
          cmake -S . -B build-src-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pomelodb" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGPDB_ENABLE_DEBUG_EXTENSIONS=ON \
            -DGPDB_ENABLE_ORCA=ON \
            -DGPDB_WITH_PERL=ON \
            -DGPDB_WITH_PYTHON=ON \
            -DGPDB_WITH_OPENSSL=ON \
            -DGPDB_WITH_GSSAPI=ON \
            -DGPDB_WITH_LIBXML=ON \
            -DGPDB_WITH_ZLIB=ON \
            -DGPDB_WITH_LIBBZ2=ON \
            -DGPDB_WITH_ZSTD=ON \
            -DGPDB_APR_CONFIG=/usr/bin/apr-1-config

      - name: Build and install native test targets
        run: |
          cmake --build build-src-tests --target gpdb gpdb-regression-tools --parallel 2
          cmake --install build-src-tests --prefix "$RUNNER_TEMP/pomelodb"

      - name: Package native install
        run: |
          mkdir -p "$RUNNER_TEMP/pomelodb-source-build"
          tar -C "$RUNNER_TEMP" -czf \
            "$RUNNER_TEMP/pomelodb-source-build/pomelodb-native.tar.gz" \
            pomelodb

      - name: Upload native build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomelodb-native-source-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/pomelodb-source-build/pomelodb-native.tar.gz

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  src-regression:
    needs: src-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install runtime dependencies
        run: bash .github/scripts/source-test-dependencies.sh runtime

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: pomelodb-native-source-build-${{ github.sha }}
          path: ${{ runner.temp }}/pomelodb-source-build

      - name: Extract native install
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/pomelodb-source-build/pomelodb-native.tar.gz"

      - name: Export native install path
        run: echo "POMELODB_INSTALL_PREFIX=$RUNNER_TEMP/pomelodb" >> "$GITHUB_ENV"

      - name: Initialize production MPP test cluster
        shell: bash
        run: bash .github/scripts/init-native-source-test-cluster.sh

      - name: Run src/test/regress schedule
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$POMELODB_INSTALL_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$POMELODB_INSTALL_PREFIX/lib:$POMELODB_INSTALL_PREFIX/lib/postgresql:${LD_LIBRARY_PATH:-}"
          echo "psql=$(command -v psql)"
          psql --version
          "$POMELODB_INSTALL_PREFIX/bin/pg_regress" --version
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/pomelodb-regress-results"
          export PGOPTIONS='-c optimizer=off'
          : > "$RUNNER_TEMP/pomelodb-regression.log"
          : > "$RUNNER_TEMP/pomelodb-regression.status"

          run_schedule() {
            local schedule_name="$1"
            local schedule_status=0
            echo "===== running $schedule_name =====" | tee -a "$RUNNER_TEMP/pomelodb-regression.log"
            set +e
            timeout --foreground --kill-after=60s 45m \
              "$POMELODB_INSTALL_PREFIX/bin/pg_regress" \
              --inputdir="$GITHUB_WORKSPACE/src/test/regress" \
              --outputdir="$RUNNER_TEMP/pomelodb-regress-results/$schedule_name" \
              --bindir="$POMELODB_INSTALL_PREFIX/bin" \
              --dlpath="$POMELODB_INSTALL_PREFIX/share/postgresql/regress" \
              --tablespace-dir="$RUNNER_TEMP/pomelodb-regress-results/$schedule_name/tablespace" \
              --max-concurrent-tests=20 \
              --init-file="$GITHUB_WORKSPACE/src/test/regress/init_file" \
              --load-extension=gp_inject_fault \
              --schedule="$GITHUB_WORKSPACE/src/test/regress/$schedule_name" \
              > >(tee -a "$RUNNER_TEMP/pomelodb-regression.log") 2>&1 &
            local regress_pid=$!
            while kill -0 "$regress_pid" 2>/dev/null; do
              echo "[$(date -u +%FT%TZ)] $schedule_name still running" \
                | tee -a "$RUNNER_TEMP/pomelodb-regression.log"
              sleep 60
            done
            wait "$regress_pid"
            schedule_status=$?
            set -e
            printf '%s=%s\n' "$schedule_name" "$schedule_status" \
              >> "$RUNNER_TEMP/pomelodb-regression.status"
          }

          run_schedule parallel_schedule
          run_schedule greenplum_schedule

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pomelodb-src-regression-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/pomelodb-regression.log
            ${{ runner.temp }}/pomelodb-regression.status
            ${{ runner.temp }}/pomelodb-regress-results
            ${{ runner.temp }}/pomelodb-native-mpp/log

      - name: Summarize regression failures
        if: always()
        shell: bash
        run: |
          status=0
          if [[ ! -s "$RUNNER_TEMP/pomelodb-regression.status" ]]; then
            status=1
            echo 'Regression status file is missing; pg_regress did not complete.' >> "$GITHUB_STEP_SUMMARY"
          else
            while IFS='=' read -r schedule_name schedule_status; do
              if [[ "$schedule_status" != 0 ]]; then
                status=1
                echo "$schedule_name exited with status $schedule_status." >> "$GITHUB_STEP_SUMMARY"
              fi
            done < "$RUNNER_TEMP/pomelodb-regression.status"
          fi
          echo '### src/test/regress summary' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/pomelodb-regression.log" ]]; then
            result_lines="$(grep -Ec '^[[:space:]]+[[:alnum:]_./-]+[[:space:]]+\.\.\.' \
              "$RUNNER_TEMP/pomelodb-regression.log" || true)"
            echo "Observed regression result lines: $result_lines" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result_lines" -eq 0 ]]; then
              status=1
              echo 'No regression test result lines were produced.' >> "$GITHUB_STEP_SUMMARY"
            fi
            grep -E '^[[:space:]]+[[:alnum:]_./-]+[[:space:]]+\.\.\.[[:space:]]+FAILED' \
              "$RUNNER_TEMP/pomelodb-regression.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo 'Last regression output:' >> "$GITHUB_STEP_SUMMARY"
            tail -80 "$RUNNER_TEMP/pomelodb-regression.log" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Stop isolated MPP cluster
        if: always()
        shell: bash
        run: |
          if [[ -n "${COORDINATOR_DATA_DIRECTORY:-}" && -x "$POMELODB_INSTALL_PREFIX/bin/gpstop" ]]; then
            COORDINATOR_DATA_DIRECTORY="$COORDINATOR_DATA_DIRECTORY" \
              "$POMELODB_INSTALL_PREFIX/bin/gpstop" -a -d "$COORDINATOR_DATA_DIRECTORY" || true
          fi
