name: PomeloDB Source Tests

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'docs/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.svg'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'docs/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.svg'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  src-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      GPDB_LEGACY_BUILD_DIR: ${{ github.workspace }}/../pomelodb-legacy
      POMELODB_INSTALL_PREFIX: ${{ github.workspace }}/../pomelodb

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: src-tests-ccache-${{ runner.os }}-${{ hashFiles('configure', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            src-tests-ccache-${{ runner.os }}-

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ccache cmake ninja-build pkg-config flex bison \
            libapr1-dev libbz2-dev libcurl4-openssl-dev libevent-dev \
            libicu-dev libipc-run-perl libkrb5-dev libldap2-dev \
            libldap-common libperl-dev libssl-dev libxml2-dev \
            libyaml-dev libxerces-c-dev libzstd-dev locales \
            krb5-admin-server krb5-kdc ldap-utils slapd \
            libreadline-dev openssh-server perl python3-dev python3-psutil \
            python3-psycopg2 \
            zlib1g-dev

          sudo localedef -i de_DE -f ISO-8859-1 de_DE.ISO8859-1 || true
          sudo localedef -i el_GR -f ISO-8859-7 gr_GR.ISO8859-7 || true
          sudo localedef -i ru_RU -f KOI8-R ru_RU.KOI8-R || true

      - name: Reset and verify ccache
        run: |
          ccache --zero-stats
          ccache --show-config

      - name: Configure legacy test build through CMake
        run: |
          cmake -S . -B build-src-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$POMELODB_INSTALL_PREFIX" \
            -DGPDB_LEGACY_BUILD_DIR="$GPDB_LEGACY_BUILD_DIR" \
            -DGPDB_CONFIGURE_ENV="CC=ccache gcc;CXX=ccache g++" \
            -DGPDB_ENABLE_NATIVE_TARGETS=OFF \
            -DPOMELODB_WITH_DUCKDB=OFF \
            -DGPDB_ENABLE_TAP_TESTS=ON \
            -DGPDB_ENABLE_DEBUG_EXTENSIONS=ON \
            -DGPDB_WITH_PERL=ON \
            -DGPDB_WITH_PYTHON=ON \
            -DGPDB_WITH_OPENSSL=ON \
            -DGPDB_WITH_GSSAPI=ON \
            -DGPDB_WITH_LDAP=ON \
            -DGPDB_WITH_LIBXML=ON \
            -DGPDB_WITH_ZLIB=ON \
            -DGPDB_WITH_LIBBZ2=ON \
            -DGPDB_WITH_ZSTD=ON \
            -DGPDB_WITH_LIBCURL=ON \
            -DGPDB_APR_CONFIG=/usr/bin/apr-1-config

      - name: Build database and test programs
        run: |
          cmake --build build-src-tests --target gpdb --parallel 4

      - name: Prepare and verify regression Perl helpers
        run: |
          for helper in atmsort.pm explain.pm; do
            ln -sf "$GITHUB_WORKSPACE/src/test/regress/$helper" \
              "$GPDB_LEGACY_BUILD_DIR/src/test/regress/$helper"
          done
          ln -sfn "$GITHUB_WORKSPACE/src/test/regress/init_file" \
            "$GPDB_LEGACY_BUILD_DIR/src/test/regress/init_file"
          for init_file in \
            init_file_isolation2 \
            init_file_parallel_retrieve_cursor \
            init_file_resgroup; do
            ln -sfn "$GITHUB_WORKSPACE/src/test/isolation2/$init_file" \
              "$GPDB_LEGACY_BUILD_DIR/src/test/isolation2/$init_file"
          done
          for helper in sql_isolation_testcase.py global_sh_executor.sh; do
            ln -sfn "$GITHUB_WORKSPACE/src/test/isolation2/$helper" \
              "$GPDB_LEGACY_BUILD_DIR/src/test/isolation2/$helper"
          done
          ln -sfn "$GITHUB_WORKSPACE/src/test/isolation2/script" \
            "$GPDB_LEGACY_BUILD_DIR/src/test/isolation2/script"
          # isolation2 external-table cases reuse the regression data files.
          ln -sfn "$GITHUB_WORKSPACE/src/test/regress/data" \
            "$GITHUB_WORKSPACE/src/test/isolation2/data"
          test -r "$GITHUB_WORKSPACE/src/test/isolation2/data/exttab_few_errors.data"

          # GPTest.pm is generated from GPTest.pm.in by configure; it must
          # remain the build-tree version so it contains the configured DB version.
          test -r "$GPDB_LEGACY_BUILD_DIR/src/test/regress/GPTest.pm"
          "$GPDB_LEGACY_BUILD_DIR/src/test/regress/gpdiff.pl" -V

      - name: Initialize production MPP test cluster
        run: |
          set -euo pipefail
          sudo service ssh start
          install -d -m 700 "$HOME/.ssh"
          if [[ ! -f "$HOME/.ssh/id_ed25519" ]]; then
            ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          fi
          touch "$HOME/.ssh/authorized_keys"
          grep -qxF "$(cat "$HOME/.ssh/id_ed25519.pub")" \
            "$HOME/.ssh/authorized_keys" || \
            cat "$HOME/.ssh/id_ed25519.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          ssh-keyscan -H "$(hostname -s)" localhost >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

          cmake --build build-src-tests --target gpdb-install --parallel 4
          make -C "$GPDB_LEGACY_BUILD_DIR/src/test/regress" all
          ln -sfn "$GPDB_LEGACY_BUILD_DIR/src/test/regress/regress.so" \
            "$GITHUB_WORKSPACE/src/test/regress/regress.so"
          for uao_dir in uao_dml uao_ddl; do
            mkdir -p "$GITHUB_WORKSPACE/src/test/regress/sql/$uao_dir"
            for source_file in "$GITHUB_WORKSPACE/src/test/regress/input/$uao_dir"/*.source; do
              source_name="$(basename "$source_file" .source)"
              for orientation in row column; do
                am_name=ao_row
                ao_segment=aoseg
                if [[ "$orientation" == column ]]; then
                  am_name=ao_column
                  ao_segment=aocsseg
                fi
                output_name="${source_name}_${orientation}.sql"
                if [[ "$source_name" == *_optimizer ]]; then
                  output_name="${source_name%_optimizer}_${orientation}_optimizer.sql"
                fi
                sed \
                  -e "s|@amname@|$am_name|g" \
                  -e "s|@aoseg@|$ao_segment|g" \
                  -e "s|@abs_srcdir@|$GITHUB_WORKSPACE/src/test/regress|g" \
                  -e "s|@abs_builddir@|$GITHUB_WORKSPACE/src/test/regress|g" \
                  "$source_file" \
                  > "$GITHUB_WORKSPACE/src/test/regress/sql/$uao_dir/$output_name"
              done
            done
          done
          export PATH="$POMELODB_INSTALL_PREFIX/bin:$PATH"
          source "$POMELODB_INSTALL_PREFIX/greenplum_path.sh"
          export PGHOST=127.0.0.1 PGPORT=5432 PGDATABASE=postgres
          # The isolation2 expected files use the en_US collation order, and
          # gp_collation needs a non-C locale to exercise OS locale lookup.
          export LC_ALL=en_US.UTF-8
          coordinator_host="$(hostname -s)"
          ssh-keyscan -H "$coordinator_host" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/pomelodb-coordinator" \
            "$RUNNER_TEMP/pomelodb-segment0" \
            "$RUNNER_TEMP/pomelodb-segment1" \
            "$RUNNER_TEMP/pomelodb-segment2" \
            "$RUNNER_TEMP/pomelodb-mirror0" \
            "$RUNNER_TEMP/pomelodb-mirror1" \
            "$RUNNER_TEMP/pomelodb-mirror2"
          test -r "$POMELODB_INSTALL_PREFIX/bin/lib/gp_bash_version.sh"
          cat > "$RUNNER_TEMP/hostfile_gpinitsystem" <<EOF
          $coordinator_host
          EOF
          cat > "$RUNNER_TEMP/gpinitsystem_config" <<EOF
          MACHINE_LIST_FILE=$RUNNER_TEMP/hostfile_gpinitsystem
          SEG_PREFIX=gpseg
          PORT_BASE=6000
          declare -a DATA_DIRECTORY=(
            $RUNNER_TEMP/pomelodb-segment0
            $RUNNER_TEMP/pomelodb-segment1
            $RUNNER_TEMP/pomelodb-segment2
          )
          MIRROR_PORT_BASE=7000
          declare -a MIRROR_DATA_DIRECTORY=(
            $RUNNER_TEMP/pomelodb-mirror0
            $RUNNER_TEMP/pomelodb-mirror1
            $RUNNER_TEMP/pomelodb-mirror2
          )
          COORDINATOR_HOSTNAME=$coordinator_host
          COORDINATOR_DIRECTORY=$RUNNER_TEMP/pomelodb-coordinator
          COORDINATOR_PORT=5432
          STANDBY_HOSTNAME=$coordinator_host
          STANDBY_PORT=5433
          STANDBY_DATADIR=$RUNNER_TEMP/pomelodb-standby
          TRUSTED_SHELL=ssh
          ENCODING=UNICODE
          EOF
          gpinitsystem -c "$RUNNER_TEMP/gpinitsystem_config" -a
          export COORDINATOR_DATA_DIRECTORY="$RUNNER_TEMP/pomelodb-coordinator/gpseg-1"
          gpstate -Q
          psql -v ON_ERROR_STOP=1 -c \
            "select count(*) from gp_segment_configuration where status='u' and role='p'"

      - name: Run src/test installcheck suites against production MPP
        env:
          PG_TEST_EXTRA: ssl kerberos ldap
        run: |
          export PATH="$POMELODB_INSTALL_PREFIX/bin:$PATH"
          source "$POMELODB_INSTALL_PREFIX/greenplum_path.sh"
          export COORDINATOR_DATA_DIRECTORY="$RUNNER_TEMP/pomelodb-coordinator/gpseg-1"
          export MASTER_DATA_DIRECTORY="$COORDINATOR_DATA_DIRECTORY"
          export PGHOST=127.0.0.1 PGPORT=5432 PGDATABASE=postgres
          export EXTRA_REGRESS_OPTS="--max-concurrent-tests=20"
          mkdir -p "$GITHUB_WORKSPACE/src/test/regress/expected/uao_dml" \
            "$GITHUB_WORKSPACE/src/test/regress/expected/uao_ddl"
          for uao_dir in uao_dml uao_ddl; do
            for source_file in "$GITHUB_WORKSPACE/src/test/regress/output/$uao_dir"/*.source; do
              source_name="$(basename "$source_file" .source)"
              for orientation in row column; do
                am_name=ao_row
                ao_segment=aoseg
                if [[ "$orientation" == column ]]; then
                  am_name=ao_column
                  ao_segment=aocsseg
                fi
                output_name="${source_name}_${orientation}.out"
                if [[ "$source_name" == *_optimizer ]]; then
                  output_name="${source_name%_optimizer}_${orientation}_optimizer.out"
                fi
                sed \
                  -e "s|@amname@|$am_name|g" \
                  -e "s|@aoseg@|$ao_segment|g" \
                  -e "s|@abs_srcdir@|$GITHUB_WORKSPACE/src/test/regress|g" \
                  "$source_file" \
                  > "$GITHUB_WORKSPACE/src/test/regress/expected/$uao_dir/$output_name"
              done
            done
          done
          test -r "$GITHUB_WORKSPACE/src/test/regress/expected/uao_dml/gp_fastsequence_row.out"
          make -C "$GPDB_LEGACY_BUILD_DIR/src/test/fsync" all
          ln -sfn "$GPDB_LEGACY_BUILD_DIR/src/test/fsync/fsync_helper.so" \
            "$GITHUB_WORKSPACE/src/test/regress/fsync_helper.so"
          make -C "$GPDB_LEGACY_BUILD_DIR/src/test/walrep" all
          ln -sfn "$GPDB_LEGACY_BUILD_DIR/src/test/walrep/gplibpq.so" \
            "$GITHUB_WORKSPACE/src/test/regress/gplibpq.so"
          test -r "$GITHUB_WORKSPACE/src/test/regress/gplibpq.so"
          make -C "$GPDB_LEGACY_BUILD_DIR/src/test/heap_checksum" all
          ln -sfn "$GPDB_LEGACY_BUILD_DIR/src/test/heap_checksum/heap_checksum_helper.so" \
            "$GITHUB_WORKSPACE/src/test/regress/heap_checksum_helper.so"
          test -r "$GITHUB_WORKSPACE/src/test/regress/heap_checksum_helper.so"
          echo "Single-runner source tests use coordinator, standby, primary, and mirror instances"
          echo "Running the upstream regression schedules independently to preserve setup order"
          make -C "$GPDB_LEGACY_BUILD_DIR/src/test" installcheck \
            REGRESS_OPTS="--dlpath=. --max-concurrent-tests=20 --init-file=$GITHUB_WORKSPACE/src/test/regress/init_file --outputdir=$GITHUB_WORKSPACE/src/test/regress" \
            REGRESS_SCHEDULE_OPTS="--schedule=$GITHUB_WORKSPACE/src/test/regress/parallel_schedule"
          make -C "$GPDB_LEGACY_BUILD_DIR/src/test" installcheck \
            REGRESS_OPTS="--dlpath=. --max-concurrent-tests=20 --init-file=$GITHUB_WORKSPACE/src/test/regress/init_file --outputdir=$GITHUB_WORKSPACE/src/test/regress" \
            REGRESS_SCHEDULE_OPTS="--schedule=$GITHUB_WORKSPACE/src/test/regress/greenplum_schedule"

      - name: Install database for excluded src/test suites
        run: |
          cmake --build build-src-tests --target gpdb-install --parallel 4
          make -C "$GPDB_LEGACY_BUILD_DIR/src/test/examples" all
          make -C "$GPDB_LEGACY_BUILD_DIR/src/test/locale" all

      - name: Run locale suites
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
        run: |
          export PATH="$POMELODB_INSTALL_PREFIX/bin:$PATH"
          source "$POMELODB_INSTALL_PREFIX/greenplum_path.sh"
          export COORDINATOR_DATA_DIRECTORY="$RUNNER_TEMP/pomelodb-coordinator/gpseg-1"

          make -C "$GPDB_LEGACY_BUILD_DIR/src/test/locale" \
            check-de_DE.ISO8859-1 \
            check-gr_GR.ISO8859-7 \
            check-koi8-r \
            check-koi8-to-win1251

      - name: Collect source test artifacts
        if: always()
        run: |
          collect_path() {
            source_path="$1"
            relative_path="${source_path#"$GPDB_LEGACY_BUILD_DIR/"}"
            mkdir -p "ci-artifacts/$(dirname "$relative_path")"
            cp -a "$source_path" "ci-artifacts/$relative_path"
          }

          while IFS= read -r -d '' source_path; do
            collect_path "$source_path"
          done < <(find "$GPDB_LEGACY_BUILD_DIR/src/test" \
            -type d \( -name tmp_check -o -name results -o -name output_iso \) \
            -print0)

          if [[ -d "$GITHUB_WORKSPACE/src/test/regress/results" ]]; then
            mkdir -p ci-artifacts/source-regress
            cp -a "$GITHUB_WORKSPACE/src/test/regress/results" \
              ci-artifacts/source-regress/results
          fi
          for report in regression.out regression.diffs; do
            if [[ -f "$GITHUB_WORKSPACE/src/test/regress/$report" ]]; then
              cp -a "$GITHUB_WORKSPACE/src/test/regress/$report" \
                ci-artifacts/source-regress/$report
            fi
          done

          while IFS= read -r -d '' source_path; do
            collect_path "$source_path"
          done < <(find "$GPDB_LEGACY_BUILD_DIR/src/test" \
            -type f \( -name regression.diffs -o -name regression.out \) \
            -print0)

          if [[ -f "$RUNNER_TEMP/pomelodb-locale.log" ]]; then
            cp -a "$RUNNER_TEMP/pomelodb-locale.log" ci-artifacts/
          fi

      - name: Upload source test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: src-tests-${{ runner.os }}-${{ github.run_id }}
          if-no-files-found: warn
          path: ci-artifacts/**

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
