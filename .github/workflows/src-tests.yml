name: PomeloDB Source Tests

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "README*", "docs/**", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg"]
  pull_request:
    paths-ignore: ["**/*.md", "README*", "docs/**", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  src-build:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    env:
      BUILD_IMAGE: localhost/mytestdb-build:ubuntu24.04-v1

    steps:
      - name: Verify self-hosted Docker runner
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -r /etc/debian_version
          command -v docker
          docker info >/dev/null
          docker image inspect "$BUILD_IMAGE" >/dev/null

      - name: Load runner proxy configuration
        run: |
          set -euo pipefail
          proxy_env="$({ bash --noprofile --rcfile "$HOME/.bashrc" -ic env 2>/dev/null || true; } \
            | awk -F= '$1 ~ /^(http|https|all|no)_proxy$/ || $1 ~ /^(HTTP|HTTPS|ALL|NO)_PROXY$/')"
          [[ -z "$proxy_env" ]] || printf '%s\n' "$proxy_env" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pomelodb-source-ccache
          key: src-tests-ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            src-tests-ccache-${{ runner.os }}-

      - name: Prepare build directories
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pomelodb-source-build" "$RUNNER_TEMP/pomelodb-source-ccache"

      - name: Build native Debug install in Docker
        run: |
          set -Eeuo pipefail
          proxy_args=()
          for proxy_name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy; do
            if [[ -n "${!proxy_name+x}" ]]; then
              proxy_value="${!proxy_name}"
              if [[ "$proxy_name" != NO_PROXY && "$proxy_name" != no_proxy ]]; then
                proxy_value="${proxy_value//127.0.0.1/host.docker.internal}"
                proxy_value="${proxy_value//localhost/host.docker.internal}"
              fi
              proxy_args+=(--env "$proxy_name=$proxy_value")
            fi
          done
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --add-host host.docker.internal:host-gateway \
            --env HOME=/tmp/runner-home \
            --env CCACHE_DIR=/ccache \
            --env CCACHE_BASEDIR=/workspace \
            --env CCACHE_COMPILERCHECK=content \
            --env BUILD_ARTIFACT_DIR=/artifact \
            "${proxy_args[@]}" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/pomelodb-source-build,dst=/artifact" \
            --mount "type=bind,src=$RUNNER_TEMP/pomelodb-source-ccache,dst=/ccache" \
            "$BUILD_IMAGE" \
            bash -euo pipefail -c '
              mkdir -p /tmp/runner-home
              bash /workspace/.github/scripts/build-native-source-in-container.sh
              ccache --show-stats
            '

      - name: Verify Docker build artifact exists
        run: test -s "$RUNNER_TEMP/pomelodb-source-build/pomelodb-native.tar.gz"

      - name: Verify native source-test artifact
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/pomelodb-source-build/pomelodb-native.tar.gz"
          verify_root="$RUNNER_TEMP/pomelodb-source-artifact-check"
          rm -rf "$verify_root"
          mkdir -p "$verify_root"
          tar -C "$verify_root" -xzf "$artifact"
          install_root="$verify_root/pomelodb-install"
          for program in pg_regress pg_isolation_regress pg_isolation2_regress isolationtester; do
            test -x "$install_root/bin/$program"
          done
          test -x "$install_root/libexec/ifaddrs"
          test -x "$install_root/bin/lib/gpcreateseg.sh"
          test -x "$install_root/bin/lib/gp_bash_functions.sh"
          for module in regress.so fsync_helper.so gplibpq.so heap_checksum_helper.so; do
            find "$install_root/lib/postgresql" "$install_root/share/postgresql/regress" \
              -name "$module" -type f -print -quit 2>/dev/null | grep -q .
          done
          for suite in regress isolation isolation2 fsync walrep heap_checksum fdw locale authentication recovery kerberos ldap ssl modules perl; do
            test -d "$install_root/share/postgresql/source-tests/$suite"
          done

      - name: Verify packaged native install
        run: test -s "$RUNNER_TEMP/pomelodb-source-build/pomelodb-native.tar.gz"

      - name: Upload native build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomelodb-native-source-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/pomelodb-source-build/pomelodb-native.tar.gz

      - name: Show ccache statistics
        if: always()
        run: |
          docker run --rm \
            --mount "type=bind,src=$RUNNER_TEMP/pomelodb-source-ccache,dst=/ccache" \
            --env CCACHE_DIR=/ccache \
            "$BUILD_IMAGE" ccache --show-stats || true

  src-suite:
    needs: src-build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite:
          - regress
          - isolation
          - isolation2
          - fsync
          - walrep
          - heap_checksum
          - fdw
          - locale
          - authentication
          - recovery
          - kerberos
          - ldap
          - ssl
          - modules
          - vacuum_progress_row
          - vacuum_progress_column

    steps:
      - name: Verify self-hosted Docker runner
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          command -v docker
          docker info >/dev/null
          docker image inspect localhost/mytestdb-build:ubuntu24.04-v1 >/dev/null

      - name: Load runner proxy configuration
        run: |
          set -euo pipefail
          proxy_env="$({ bash --noprofile --rcfile "$HOME/.bashrc" -ic env 2>/dev/null || true; } \
            | awk -F= '$1 ~ /^(http|https|all|no)_proxy$/ || $1 ~ /^(HTTP|HTTPS|ALL|NO)_PROXY$/')"
          [[ -z "$proxy_env" ]] || printf '%s\n' "$proxy_env" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download native build artifact
        uses: actions/download-artifact@v4
        with:
          name: pomelodb-native-source-build-${{ github.sha }}
          path: ${{ runner.temp }}/pomelodb-source-build

      - name: Extract native install
        run: test -s "$RUNNER_TEMP/pomelodb-source-build/pomelodb-native.tar.gz"

      - name: Prepare container result directory
        shell: bash
        run: |
          set -euo pipefail
          # Self-hosted runners retain RUNNER_TEMP between jobs.  Use a
          # run-unique directory so a failed gpinitsystem cannot make the
          # next attempt reject an already existing coordinator data dir.
          RESULTS_DIR="$RUNNER_TEMP/pomelodb-${{ matrix.suite }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-results"
          echo "RESULTS_DIR=$RESULTS_DIR" >> "$GITHUB_ENV"
          rm -rf "$RESULTS_DIR"
          mkdir -p "$RESULTS_DIR"

      - name: Run ${{ matrix.suite }} source-test suite
        id: suite
        if: always()
        continue-on-error: true
        env:
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -Eeuo pipefail
          proxy_args=()
          for proxy_name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy; do
            if [[ -n "${!proxy_name+x}" ]]; then
              proxy_value="${!proxy_name}"
              if [[ "$proxy_name" != NO_PROXY && "$proxy_name" != no_proxy ]]; then
                proxy_value="${proxy_value//127.0.0.1/host.docker.internal}"
                proxy_value="${proxy_value//localhost/host.docker.internal}"
              fi
              proxy_args+=(--env "$proxy_name=$proxy_value")
            fi
          done
          set +e
          docker run --rm --init \
            --add-host host.docker.internal:host-gateway \
            --env HOME=/tmp/runner-home \
            --env ARTIFACT_DIR=/artifact \
            --env RESULTS_DIR=/results \
            --env SUITE="$SUITE" \
            --env RESULTS_UID="$(id -u)" \
            --env RESULTS_GID="$(id -g)" \
            "${proxy_args[@]}" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/pomelodb-source-build,dst=/artifact,readonly" \
            --mount "type=bind,src=$RESULTS_DIR,dst=/results" \
            localhost/mytestdb-build:ubuntu24.04-v1 \
            bash /workspace/.github/scripts/run-native-source-suite-in-container.sh
          status="$?"
          set -e
          exit "$status"

      - name: Upload ${{ matrix.suite }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pomelodb-src-${{ matrix.suite }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/pomelodb-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}-results

      - name: Summarize ${{ matrix.suite }} failures
        if: always()
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -u
          results_dir="$RESULTS_DIR"
          status_file="$results_dir/pomelodb-${SUITE}.status"
          log_file="$results_dir/pomelodb-${SUITE}.log"
          cluster_log="$results_dir/pomelodb-native-mpp/gpinitsystem.log"
          container_log="$results_dir/container-entrypoint.log"
          final_status=1
          {
            echo "## $SUITE source-test summary"
            if [[ ! -s "$status_file" ]]; then
              echo "The suite produced no status file; initialization or execution failed early."
            else
              while IFS='=' read -r name value; do
                [[ -n "$name" ]] || continue
                echo "- \`$name\`: \`$value\`"
                if [[ "$name" == suite_status ]]; then
                  final_status="$value"
                fi
              done < "$status_file"
            fi
            if [[ -f "$log_file" ]]; then
              echo
              echo '### Failure/error lines'
              grep -E 'FAILED|ERROR|timed out|No such file|not found|BAIL_OUT' "$log_file" \
                | tail -n 120 || echo 'No failure marker was observed; inspect the complete artifact.'
              echo
              echo '### Last output'
              tail -80 "$log_file"
            fi
            if [[ -f "$cluster_log" ]]; then
              echo
              echo '### MPP initialization output'
              tail -120 "$cluster_log"
            fi
            if [[ -f "$container_log" ]]; then
              echo
              echo '### Container entrypoint output'
              tail -120 "$container_log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$final_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Stop production MPP test cluster
        if: always()
        run: echo 'Cluster teardown is performed inside the Docker test container.'
