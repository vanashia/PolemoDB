name: PomeloDB ABI Tests

on:
  workflow_dispatch:
  pull_request:
    paths: ["src/**", "cmake/**", "CMakeLists.txt", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["src/**", "cmake/**", "CMakeLists.txt", ".github/workflows/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  abi-dump-setup:
    runs-on: ubuntu-24.04
    outputs:
      baseline_ref: ${{ steps.vars.outputs.baseline_ref }}
    steps:
      - name: Resolve comparison base
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          baseline='${{ github.event.pull_request.base.sha }}'
          if [[ -z "$baseline" ]]; then
            baseline='${{ github.event.before }}'
          fi
          if [[ -z "$baseline" || "$baseline" =~ ^0+$ ]]; then
            baseline='${{ github.sha }}^'
          fi
          echo "baseline_ref=$baseline" >> "$GITHUB_OUTPUT"

  abi-dump:
    needs: abi-dump-setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-baseline
            ref: ${{ needs.abi-dump-setup.outputs.baseline_ref }}
          - name: build-latest
            ref: ${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          path: source
          submodules: false

      - name: Install ABI and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            abi-dumper abi-compliance-checker build-essential cmake ninja-build \
            ccache flex bison pkg-config libapr1-dev libevent-dev libyaml-dev \
            libcurl4-openssl-dev libxerces-c-dev libxml2-dev libkrb5-dev libperl-dev python3-dev \
            libreadline-dev zlib1g-dev libbz2-dev libzstd-dev libssl-dev

      - name: Build native ABI binary
        working-directory: source
        run: |
          cmake -S . -B build-abi -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS='-Og -g3' \
            -DCMAKE_CXX_FLAGS='-Og -g3' \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pomelodb" \
            -DGPDB_ENABLE_ORCA=OFF \
            -DGPDB_ENABLE_DEBUG_EXTENSIONS=ON \
            -DGPDB_WITH_PERL=ON \
            -DGPDB_WITH_PYTHON=ON \
            -DGPDB_WITH_OPENSSL=ON \
            -DGPDB_WITH_GSSAPI=ON \
            -DGPDB_WITH_LIBXML=ON \
            -DGPDB_WITH_ZLIB=ON \
            -DGPDB_WITH_LIBBZ2=ON \
            -DGPDB_WITH_ZSTD=ON \
            -DGPDB_APR_CONFIG=/usr/bin/apr-1-config
          cmake --build build-abi --target postgres --parallel 2
          mkdir -p "$RUNNER_TEMP/pomelodb-abi/include"
          cp build-abi/postgres "$RUNNER_TEMP/pomelodb-abi/postgres"
          cp -a src/include/. "$RUNNER_TEMP/pomelodb-abi/include/"

      - name: Dump ABI
        run: |
          abi-dumper \
            -lver "${{ matrix.ref }}" \
            -skip-cxx \
            -public-headers "$RUNNER_TEMP/pomelodb-abi/include" \
            -o "postgres-${{ matrix.name }}.abi" \
            "$RUNNER_TEMP/pomelodb-abi/postgres"

      - name: Upload ABI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: postgres-${{ matrix.name }}.abi

  abi-compare:
    needs: abi-dump
    runs-on: ubuntu-24.04
    steps:
      - name: Install ABI comparison tools
        run: |
          sudo apt-get update
          sudo apt-get install -y abi-compliance-checker

      - name: Download baseline ABI
        uses: actions/download-artifact@v4
        with:
          name: build-baseline
          path: abi

      - name: Download latest ABI
        uses: actions/download-artifact@v4
        with:
          name: build-latest
          path: abi

      - name: Compare ABI
        continue-on-error: true
        run: |
          abi-compliance-checker \
            -l PomeloDB \
            -old abi/postgres-build-baseline.abi \
            -new abi/postgres-build-latest.abi \
            -report-path abi/compatibility-report.html

      - name: Upload ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pomelodb-abi-report-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: abi
