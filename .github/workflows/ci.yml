name: PomeloDB CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config flex bison \
            libapr1-dev libevent-dev libyaml-dev libxerces-c-dev \
            libxml2-dev libkrb5-dev libperl-dev python3-dev \
            libreadline-dev zlib1g-dev libbz2-dev libzstd-dev \
            libcurl4-openssl-dev libssl-dev libicu-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja apr libevent libyaml xerces-c pkg-config

      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            APR_CONFIG="$(brew --prefix apr)/bin/apr-1-config"
            LIBEVENT="$(brew --prefix libevent)"
            LIBYAML="$(brew --prefix libyaml)"
            XERCES="$(brew --prefix xerces-c)"

            cmake -S . -B build-ci -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS="-Wno-error=maybe-uninitialized" \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pomelodb" \
              -DGPDB_WITH_PERL=ON \
              -DGPDB_WITH_PYTHON=ON \
              -DGPDB_WITH_LIBXML=ON \
              -DGPDB_WITH_GSSAPI=ON \
              -DGPDB_APR_CONFIG="$APR_CONFIG" \
              "-DGPDB_LIBRARIES=$LIBEVENT/lib;$LIBYAML/lib;$XERCES/lib" \
              "-DGPDB_INCLUDES=$LIBEVENT/include;$LIBYAML/include;$XERCES/include"
          else
            cmake -S . -B build-ci -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pomelodb" \
              -DGPDB_WITH_PERL=ON \
              -DGPDB_WITH_PYTHON=ON \
              -DGPDB_WITH_LIBXML=ON \
              -DGPDB_WITH_GSSAPI=ON \
              -DGPDB_APR_CONFIG=/usr/bin/apr-1-config
          fi

      - name: Build
        run: |
          cmake --build build-ci \
            --target gpdb \
            --parallel 4

      - name: Run CMake tests
        run: |
          ctest --test-dir build-ci --output-on-failure

      - name: Run PomeloDB tests
        run: |
          python3 -m py_compile gpMgmt/bin/pomelodb
          python3 gpMgmt/bin/test/pomelodb_test.py

      - name: Check patch format
        run: git diff --check
