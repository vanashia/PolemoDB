name: PomeloDB CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "README*", "docs/**", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg"]
  pull_request:
    paths-ignore: ["**/*.md", "README*", "docs/**", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache cmake ninja-build pkg-config flex bison \
            libapr1-dev libevent-dev libyaml-dev libxerces-c-dev libxml2-dev \
            libkrb5-dev libperl-dev python3-dev python3-psycopg2 \
            libreadline-dev zlib1g-dev libbz2-dev libzstd-dev libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ccache cmake ninja apr libevent libyaml xerces-c pkg-config

      - name: Configure native CMake build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pomelodb" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGPDB_ENABLE_DEBUG_EXTENSIONS=ON \
            -DGPDB_ENABLE_ORCA=ON \
            -DGPDB_WITH_PERL=ON \
            -DGPDB_WITH_PYTHON=ON \
            -DGPDB_WITH_LIBXML=ON \
            -DGPDB_WITH_GSSAPI=ON \
            -DGPDB_WITH_OPENSSL=ON \
            -DGPDB_WITH_ZLIB=ON \
            -DGPDB_WITH_LIBBZ2=ON \
            -DGPDB_WITH_ZSTD=ON \
            $([[ "$RUNNER_OS" == macOS ]] && printf '%s\n' "-DGPDB_APR_CONFIG=$(brew --prefix apr)/bin/apr-1-config" || printf '%s\n' "-DGPDB_APR_CONFIG=/usr/bin/apr-1-config")

      - name: Build native targets
        run: cmake --build build-ci --target gpdb gpdb-regression-tools --parallel 4

      - name: Install native build
        run: cmake --install build-ci --prefix "$RUNNER_TEMP/pomelodb"

      - name: Run CMake tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: Run installed manager tests
        run: |
          python3 -m py_compile "$RUNNER_TEMP/pomelodb/bin/pomelodb"
          python3 gpMgmt/bin/test/pomelodb_test.py

      - name: Check patch format
        run: git diff --check

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
