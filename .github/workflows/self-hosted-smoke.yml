name: Self-hosted Runner Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: self-hosted-smoke
  cancel-in-progress: false

jobs:
  runner-smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Verify Debian x64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -r /etc/debian_version
          printf 'runner=%s\n' "$RUNNER_NAME"
          printf 'debian=%s\n' "$(cat /etc/debian_version)"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          submodules: false

      - name: Verify native build tools
        shell: bash
        run: |
          set -euo pipefail
          required_tools=(cmake ninja ccache pkg-config flex bison m4 curl-config)
          missing_tools=()
          for tool in "${required_tools[@]}"; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing_tools+=("$tool")
            fi
          done

          if ((${#missing_tools[@]})); then
            printf 'missing native build tools: %s\n' "${missing_tools[*]}"
            if [[ "$(id -u)" == 0 ]]; then
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ccache cmake ninja-build pkg-config flex bison \
                libcurl4-openssl-dev
            else
              # The self-hosted runner is intentionally unprivileged.  Extract
              # the parser tools into the job's temporary directory instead of
              # requiring sudo or changing the host installation.
              tool_root="$RUNNER_TEMP/pomelodb-native-tools"
              mkdir -p "$tool_root/debs" "$tool_root/root"
              (
                cd "$tool_root/debs"
                apt-get download bison flex m4 libfl2
              )
              shopt -s nullglob
              debs=("$tool_root/debs"/*.deb)
              ((${#debs[@]}))
              for deb in "${debs[@]}"; do
                dpkg-deb -x "$deb" "$tool_root/root"
              done
              export PATH="$tool_root/root/usr/bin:$PATH"
              export LD_LIBRARY_PATH="$tool_root/root/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
              export BISON_PKGDATADIR="$tool_root/root/usr/share/bison"
              export FLEX_SKELETON_FILE="$tool_root/root/usr/share/flex/skel.c"
              export M4="$tool_root/root/usr/bin/m4"
              echo "$tool_root/root/usr/bin" >> "$GITHUB_PATH"
              echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
              echo "BISON_PKGDATADIR=$BISON_PKGDATADIR" >> "$GITHUB_ENV"
              echo "FLEX_SKELETON_FILE=$FLEX_SKELETON_FILE" >> "$GITHUB_ENV"
              echo "M4=$M4" >> "$GITHUB_ENV"
            fi
          fi

          for tool in "${required_tools[@]}"; do
            command -v "$tool" >/dev/null
          done

      - name: Configure runner-local ccache
        shell: bash
        run: echo "CCACHE_DIR=$RUNNER_TEMP/pomelodb-ccache" >> "$GITHUB_ENV"

      - name: Configure native CMake build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          cmake -S . -B build-smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pomelodb" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGPDB_ENABLE_DEBUG_EXTENSIONS=ON \
            -DGPDB_ENABLE_ORCA=OFF \
            -DGPDB_WITH_PERL=OFF \
            -DGPDB_WITH_PYTHON=OFF \
            -DGPDB_WITH_LIBXML=OFF \
            -DGPDB_WITH_READLINE=OFF \
            -DGPDB_WITH_GSSAPI=OFF \
            -DGPDB_WITH_OPENSSL=ON \
            -DGPDB_WITH_ZLIB=ON \
            -DGPDB_WITH_LIBBZ2=OFF \
            -DGPDB_WITH_ZSTD=ON \
            -DGPDB_ENABLE_GPFDIST=OFF

      - name: Build and install native targets
        run: |
          cmake --build build-smoke --target gpdb gpdb-regression-tools --parallel 2
          cmake --install build-smoke --prefix "$RUNNER_TEMP/pomelodb"

      - name: Run native checks
        run: |
          ctest --test-dir build-smoke --output-on-failure
          python3 -m py_compile "$RUNNER_TEMP/pomelodb/bin/pomelodb"
          python3 gpMgmt/bin/test/pomelodb_test.py

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
