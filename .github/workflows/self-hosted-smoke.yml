name: Self-hosted Runner Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: self-hosted-smoke
  cancel-in-progress: false

jobs:
  runner-smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      BUILD_IMAGE: localhost/mytestdb-build:ubuntu24.04-v1
      BUILD_LABEL: mytestdb.self-hosted-smoke=true
      BUILD_CONTAINER: self-hosted-smoke-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Verify Debian x64 Docker runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -r /etc/debian_version
          command -v docker
          docker info >/dev/null
          docker image inspect "$BUILD_IMAGE" >/dev/null
          printf 'runner=%s\n' "$RUNNER_NAME"
          printf 'os=%s\n' "$RUNNER_OS"
          printf 'arch=%s\n' "$RUNNER_ARCH"
          printf 'debian=%s\n' "$(cat /etc/debian_version)"
          printf 'docker_image=%s\n' "$BUILD_IMAGE"
          df -h "$GITHUB_WORKSPACE"

      - name: Load runner proxy configuration
        shell: bash
        run: |
          set -euo pipefail
          proxy_env="$({
            bash --noprofile --rcfile "$HOME/.bashrc" -ic 'env' 2>/dev/null || true
          } | awk -F= '$1 ~ /^(http|https|all|no)_proxy$/ || $1 ~ /^(HTTP|HTTPS|ALL|NO)_PROXY$/')"
          if [[ -n "$proxy_env" ]]; then
            printf '%s\n' "$proxy_env" >> "$GITHUB_ENV"
            proxy_names="$(printf '%s\n' "$proxy_env" | cut -d= -f1 | paste -sd, -)"
            printf 'Loaded proxy variables: %s\n' "$proxy_names"
          else
            echo 'No proxy variables found in ~/.bashrc'
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          submodules: false

      - name: Prepare persistent ccache directory
        shell: bash
        run: |
          set -euo pipefail
          ccache_root="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}"
          CCACHE_HOST_DIR="$ccache_root/mytestdb-self-hosted-smoke-ccache"
          if ! mkdir -p "$CCACHE_HOST_DIR" 2>/dev/null || [ ! -w "$CCACHE_HOST_DIR" ]; then
            CCACHE_HOST_DIR="$RUNNER_TEMP/mytestdb-self-hosted-smoke-ccache"
            mkdir -p "$CCACHE_HOST_DIR"
          fi
          test -w "$CCACHE_HOST_DIR"
          printf 'CCACHE_HOST_DIR=%s\n' "$CCACHE_HOST_DIR" >> "$GITHUB_ENV"

      - name: Compile and test in Docker
        shell: bash
        run: |
          set -Eeuo pipefail

          # Successful containers are removed below. Failed containers are
          # retained for logs and artifact inspection.
          mapfile -t managed_containers < <(
            docker ps -aq --filter "label=$BUILD_LABEL"
          )
          retained_containers=()
          for container_id in "${managed_containers[@]}"; do
            container_status="$(docker inspect --format '{{.State.Status}}' "$container_id")"
            exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container_id")"
            if [ "$container_status" = exited ] && [ "$exit_code" -eq 0 ]; then
              docker rm "$container_id"
            else
              retained_containers+=("$container_id")
            fi
          done

          if [ "${#retained_containers[@]}" -ge 2 ]; then
            echo 'Two smoke-build containers are already retained.'
            for container_id in "${retained_containers[@]}"; do
              docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} created={{.Created}}' "$container_id"
            done
            exit 1
          fi

          proxy_args=()
          for proxy_name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy; do
            if [[ -n "${!proxy_name+x}" ]]; then
              proxy_args+=(--env "$proxy_name=${!proxy_name}")
            fi
          done

          set +e
          docker run \
            --name "$BUILD_CONTAINER" \
            --label "$BUILD_LABEL" \
            --init \
            --env HOME=/tmp/runner-home \
            --env CCACHE_DIR=/ccache \
            --env CCACHE_BASEDIR=/workspace \
            --env CCACHE_COMPILERCHECK=content \
            "${proxy_args[@]}" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$CCACHE_HOST_DIR,dst=/ccache" \
            "$BUILD_IMAGE" \
            bash -euo pipefail -c '
              trap "ccache --show-stats || true" EXIT

              mkdir -p /tmp/runner-home
              cmake -S /workspace -B /tmp/pomelodb-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/tmp/pomelodb-install \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DGPDB_ENABLE_DEBUG_EXTENSIONS=ON \
                -DGPDB_ENABLE_ORCA=ON \
                -DGPDB_WITH_PERL=ON \
                -DGPDB_WITH_PYTHON=ON \
                -DGPDB_WITH_LIBXML=ON \
                -DGPDB_WITH_GSSAPI=ON \
                -DGPDB_WITH_OPENSSL=ON \
                -DGPDB_WITH_ZLIB=ON \
                -DGPDB_WITH_LIBBZ2=ON \
                -DGPDB_WITH_ZSTD=ON \
                -DGPDB_APR_CONFIG=/usr/bin/apr-1-config

              cmake --build /tmp/pomelodb-build \
                --target gpdb gpdb-regression-tools --parallel 2
              cmake --install /tmp/pomelodb-build --prefix /tmp/pomelodb-install
              ctest --test-dir /tmp/pomelodb-build --output-on-failure
              python3 -m py_compile /tmp/pomelodb-install/bin/pomelodb
              python3 /workspace/gpMgmt/bin/test/pomelodb_test.py
            '
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            docker rm "$BUILD_CONTAINER"
            echo 'Docker compilation and tests succeeded; container removed.'
          else
            echo "Docker compilation or tests failed; container retained: $BUILD_CONTAINER"
            echo "Inspect logs with: docker logs $BUILD_CONTAINER"
          fi

          exit "$status"

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
