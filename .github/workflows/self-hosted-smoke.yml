name: Self-hosted Runner Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: self-hosted-smoke
  cancel-in-progress: false

jobs:
  runner-smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Verify Debian x64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -r /etc/debian_version
          printf 'runner=%s\n' "$RUNNER_NAME"
          printf 'debian=%s\n' "$(cat /etc/debian_version)"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          submodules: false

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache cmake ninja-build pkg-config flex bison \
            libapr1-dev libcurl4-openssl-dev libevent-dev libyaml-dev \
            libxerces-c-dev libxml2-dev libkrb5-dev libperl-dev python3-dev \
            libreadline-dev zlib1g-dev libbz2-dev libzstd-dev libssl-dev

      - name: Verify native build tools
        shell: bash
        run: command -v cmake ninja ccache pkg-config flex bison

      - name: Configure runner-local ccache
        shell: bash
        run: echo "CCACHE_DIR=$RUNNER_TEMP/pomelodb-ccache" >> "$GITHUB_ENV"

      - name: Configure native CMake build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          cmake -S . -B build-smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pomelodb" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGPDB_ENABLE_DEBUG_EXTENSIONS=ON \
            -DGPDB_ENABLE_ORCA=ON \
            -DGPDB_WITH_PERL=ON \
            -DGPDB_WITH_PYTHON=ON \
            -DGPDB_WITH_LIBXML=ON \
            -DGPDB_WITH_GSSAPI=ON \
            -DGPDB_WITH_OPENSSL=ON \
            -DGPDB_WITH_ZLIB=ON \
            -DGPDB_WITH_LIBBZ2=ON \
            -DGPDB_WITH_ZSTD=ON \
            -DGPDB_APR_CONFIG=/usr/bin/apr-1-config

      - name: Build and install native targets
        run: |
          cmake --build build-smoke --target gpdb gpdb-regression-tools --parallel 2
          cmake --install build-smoke --prefix "$RUNNER_TEMP/pomelodb"

      - name: Run native checks
        run: |
          ctest --test-dir build-smoke --output-on-failure
          python3 -m py_compile "$RUNNER_TEMP/pomelodb/bin/pomelodb"
          python3 gpMgmt/bin/test/pomelodb_test.py

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
