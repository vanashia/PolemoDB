# PomeloDB single-host production cluster configuration. Relative paths are
# resolved from this file's installation directory.
cluster_mode=mpp
coordinator_data_directory=mpp/coordinator/pomelodb-1
segment_data_directories=mpp/segment/pomelodb0
log_directory=log

# smart, fast, or immediate.  Set wait=false to omit pg_ctl -w.
stop_mode=fast
wait=true
