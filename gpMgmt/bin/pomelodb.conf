# PomeloDB local-instance configuration.  Relative paths are resolved from
# this file's installation directory, so the defaults keep data and logs out
# of the installed binaries while remaining valid for a custom --prefix.
data_directory=data
log_directory=log

# Optional arguments passed to initdb and pg_ctl start -o respectively.
initdb_options=
server_options=-b -1 -C -1 -c gp_role=utility

# smart, fast, or immediate.  Set wait=false to omit pg_ctl -w.
stop_mode=fast
wait=true
